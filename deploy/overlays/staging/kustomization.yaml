# Staging : kubectl apply -k deploy/overlays/staging
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chatvote-staging
resources:
  - ../../base
images:
  - name: rg.fr-par.scw.cloud/chatvote-v2/web
    newTag: staging-2   # tag de l'image construite pour le staging
patches:
  # Origine Zaq de staging (CSP, CORS, Permissions-Policy)
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        template:
          spec:
            containers:
              - name: caddy
                env:
                  - name: ZAQ_ORIGIN
                    value: https://zaq-staging.51.159.27.173.sslip.io
                  - name: ZAQ_HOST
                    value: zaq-staging.51.159.27.173.sslip.io
  # Domaine du staging
  - target:
      kind: Ingress
      name: web
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: app-staging.chatvote.org
      - op: replace
        path: /spec/rules/0/host
        value: app-staging.chatvote.org
